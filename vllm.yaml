# vLLM config for mistralai/Mistral-Small-3.1-24B-Instruct-2503 on Isambard AI
# Generated by ivllm generate-vllm-config
#
# Hardware: 4 × GH200 120GB per node — ~96 GiB usable HBM3e per GPU
# Model:    24B parameters, ~48 GB at bfloat16 (~55 GB in practice per model card)
# Fits on a single GH200, but tp=4 is used to provide ~290 GB of KV cache
# headroom for the full 128k native context window.

model: mistralai/Mistral-Small-3.1-24B-Instruct-2503
tensor-parallel-size: 4
max-model-len: 131072             # native context: 128k tokens
gpu-memory-utilization: 0.90
dtype: bfloat16

# Mistral-format tokeniser and loader — required for this model family
tokenizer_mode: mistral
config_format: mistral
load_format: mistral

# Vision: allow up to 10 images per prompt
limit_mm_per_prompt: "image=10"

# Tool calling
enable-auto-tool-choice: true
tool-call-parser: mistral         # Mistral native function-calling format

# Prefix caching — recommended for agent/chatbot workloads with repeated system prompts
enable-prefix-caching: true

# Minimum vLLM version required (per model card); stripped before passing to vllm serve
min-vllm-version: "0.8.1"
